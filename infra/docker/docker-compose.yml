services:
  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-shiva}
      POSTGRES_USER: ${POSTGRES_USER:-shiva}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - shiva-postgres-data:/var/lib/postgresql/data

  shiva-api:
    build:
      context: ../..
      dockerfile: infra/docker/app.Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - path: ../../.env
        required: false
    environment:
      HOST: 0.0.0.0
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-shiva}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-shiva}
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
    extra_hosts:
      - host.docker.internal:host-gateway
    ports:
      - ${SHIVA_BIND_ADDRESS:-127.0.0.1}:${PORT:-3000}:${PORT:-3000}

volumes:
  shiva-postgres-data:
