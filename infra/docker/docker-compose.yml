services:
  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    volumes:
      - shiva-redis-data:/data

  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-shiva}
      POSTGRES_USER: ${POSTGRES_USER:-shiva}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - shiva-postgres-data:/var/lib/postgresql/data

  shiva-api:
    build:
      context: ../..
      dockerfile: infra/docker/app.Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      asr:
        condition: service_started
      tts:
        condition: service_started
      face:
        condition: service_started
      device-agent:
        condition: service_started
      google-agent:
        condition: service_started
    env_file:
      - path: ../../.env
        required: false
    environment:
      HOST: 0.0.0.0
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-shiva}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-shiva}
      REDIS_URL: redis://redis:6379
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
      ASR_SERVICE_URL: http://asr:8101
      TTS_SERVICE_URL: http://tts:8102
      FACE_SERVICE_URL: http://face:8103
      DEVICE_AGENT_URL: http://device-agent:3002
    extra_hosts:
      - host.docker.internal:host-gateway
    ports:
      - ${SHIVA_BIND_ADDRESS:-127.0.0.1}:${PORT:-3000}:${PORT:-3000}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:'+(process.env.PORT||3000)+'/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 24

  # Persistent CPU-only wake-up process. It has no model/provider, Google,
  # device, Redis, voice, or face credentials and never loads an LLM.
  shiva-scheduler:
    build:
      context: ../..
      dockerfile: infra/docker/app.Dockerfile
    command: ["node", "dist/scheduler/scheduler-worker.js"]
    restart: unless-stopped
    stop_grace_period: 35s
    depends_on:
      postgres:
        condition: service_healthy
      shiva-api:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-shiva}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-shiva}
      DATABASE_SSL: "false"
      SHIVA_TIME_ZONE: ${SHIVA_TIME_ZONE:-Asia/Kolkata}
      SHIVA_SCHEDULER_CORE_URL: http://shiva-api:${PORT:-3000}
      SHIVA_SCHEDULER_TOKEN: ${SHIVA_SCHEDULER_TOKEN:?set SHIVA_SCHEDULER_TOKEN}
      SCHEDULER_DATABASE_POOL_MAX: ${SCHEDULER_DATABASE_POOL_MAX:-2}
      SCHEDULER_CORE_TIMEOUT_MS: ${SCHEDULER_CORE_TIMEOUT_MS:-330000}
      SCHEDULER_PROCESSING_UNCERTAIN_AFTER_MS: ${SCHEDULER_PROCESSING_UNCERTAIN_AFTER_MS:-600000}
      SCHEDULER_JOB_RETRY_LIMIT: ${SCHEDULER_JOB_RETRY_LIMIT:-5}
      SCHEDULER_JOB_RETRY_DELAY_SECONDS: ${SCHEDULER_JOB_RETRY_DELAY_SECONDS:-5}
      SCHEDULER_JOB_EXPIRE_SECONDS: ${SCHEDULER_JOB_EXPIRE_SECONDS:-600}
      SCHEDULER_JOB_HEARTBEAT_SECONDS: ${SCHEDULER_JOB_HEARTBEAT_SECONDS:-30}
      SCHEDULER_JOB_RETENTION_SECONDS: ${SCHEDULER_JOB_RETENTION_SECONDS:-31536000}
      SCHEDULER_JOB_DELETE_AFTER_SECONDS: ${SCHEDULER_JOB_DELETE_AFTER_SECONDS:-2592000}

  # Same image/build as shiva-api — it's the same npm package, just a
  # different process/entry point (app/src/agents/device). No database, no
  # migration step: this container just owns the phone's live connection and
  # its own small tool-calling loop.
  device-agent:
    build:
      context: ../..
      dockerfile: infra/docker/app.Dockerfile
    command: ["node", "dist/agents/device/device-agent-runner.js"]
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    environment:
      DEVICE_AGENT_HOST: 0.0.0.0
      DEVICE_AGENT_PORT: 3002
      DEVICE_AGENT_MAX_STEPS: ${DEVICE_AGENT_MAX_STEPS:-15}
      DEVICE_WS_TOKEN: ${DEVICE_WS_TOKEN:-}
      DEVICE_AGENT_MOCK_CALL_OUTCOME: ${DEVICE_AGENT_MOCK_CALL_OUTCOME:-}
      REDIS_URL: redis://redis:6379
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
      SHIVA_MODEL: ${SHIVA_MODEL:-gemma4:26b-a4b-it-q4_K_M}
      SHIVA_CONTEXT_LENGTH: ${SHIVA_CONTEXT_LENGTH:-16384}
      SHIVA_KEEP_ALIVE: ${SHIVA_KEEP_ALIVE:-30m}
      OLLAMA_REQUEST_TIMEOUT_MS: ${OLLAMA_REQUEST_TIMEOUT_MS:-300000}
      AGENT_RECLAIM_IDLE_MS: ${AGENT_RECLAIM_IDLE_MS:-30000}
      AGENT_MAX_DELIVERY_ATTEMPTS: ${AGENT_MAX_DELIVERY_ATTEMPTS:-3}
      AGENT_HEARTBEAT_TTL_SECONDS: ${AGENT_HEARTBEAT_TTL_SECONDS:-15}
      NODE_ENV: production
    extra_hosts:
      - host.docker.internal:host-gateway
    expose:
      - "3002"

  google-agent:
    build:
      context: ../..
      dockerfile: infra/docker/app.Dockerfile
    command: ["node", "dist/agents/google/google-agent-runner.js"]
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      REDIS_URL: redis://redis:6379
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
      SHIVA_MODEL: ${SHIVA_MODEL:-gemma4:26b-a4b-it-q4_K_M}
      SHIVA_CONTEXT_LENGTH: ${SHIVA_CONTEXT_LENGTH:-16384}
      SHIVA_KEEP_ALIVE: ${SHIVA_KEEP_ALIVE:-30m}
      OLLAMA_REQUEST_TIMEOUT_MS: ${OLLAMA_REQUEST_TIMEOUT_MS:-300000}
      SHIVA_USER_ID: ${SHIVA_USER_ID:-00000000-0000-4000-8000-000000000001}
      SHIVA_USER_NAME: ${SHIVA_USER_NAME:-Yash}
      SHIVA_TIME_ZONE: ${SHIVA_TIME_ZONE:-Asia/Kolkata}
      AGENT_MAX_STEPS: ${AGENT_MAX_STEPS:-12}
      AGENT_REQUEST_TIMEOUT_MS: ${AGENT_REQUEST_TIMEOUT_MS:-300000}
      AGENT_RECLAIM_IDLE_MS: ${AGENT_RECLAIM_IDLE_MS:-30000}
      AGENT_MAX_DELIVERY_ATTEMPTS: ${AGENT_MAX_DELIVERY_ATTEMPTS:-3}
      AGENT_HEARTBEAT_TTL_SECONDS: ${AGENT_HEARTBEAT_TTL_SECONDS:-15}
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:-}
      GOOGLE_OAUTH_REFRESH_TOKEN: ${GOOGLE_OAUTH_REFRESH_TOKEN:-}
      EXPENSE_SHEET_REQUEST_TIMEOUT_MS: ${EXPENSE_SHEET_REQUEST_TIMEOUT_MS:-15000}
    extra_hosts:
      - host.docker.internal:host-gateway

  asr:
    build:
      context: ../..
      dockerfile: infra/docker/asr.Dockerfile
    restart: unless-stopped
    env_file:
      - path: ../../.env
        required: false
    environment:
      ASR_HOST: 0.0.0.0
      ASR_PORT: 8101
      HF_HOME: /models/huggingface
    expose:
      - "8101"
    volumes:
      - shiva-voice-models:/models
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  tts:
    build:
      context: ../..
      dockerfile: infra/docker/tts.Dockerfile
    restart: unless-stopped
    env_file:
      - path: ../../.env
        required: false
    environment:
      TTS_HOST: 0.0.0.0
      TTS_PORT: 8102
      HF_HOME: /models/huggingface
    expose:
      - "8102"
    volumes:
      - shiva-voice-models:/models
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  face:
    build:
      context: ../..
      dockerfile: infra/docker/face.Dockerfile
    restart: unless-stopped
    env_file:
      - path: ../../.env
        required: false
    environment:
      FACE_HOST: 0.0.0.0
      FACE_PORT: 8103
      FACE_MODEL: buffalo_l
      FACE_MODEL_ROOT: /models/insightface
      FACE_PROVIDER: ${FACE_PROVIDER:-cpu}
      FACE_REQUIRE_CUDA: ${FACE_REQUIRE_CUDA:-false}
    expose:
      - "8103"
    volumes:
      - shiva-face-models:/models

volumes:
  shiva-redis-data:
  shiva-postgres-data:
  shiva-voice-models:
  shiva-face-models:
